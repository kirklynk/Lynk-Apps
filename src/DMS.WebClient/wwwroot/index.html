<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMS.WebClient</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />

    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!-- Important: Increment the version parameter whenever you update MudBlazor to prevent caching issues -->
    <link href="_content/MudBlazor/MudBlazor.min.css?v=1" rel="stylesheet" />
    <!-- Ensuring this is the last css file being applied-->
    <link rel="stylesheet" href="css/app.css?v=1.1" />
    <link href="DMS.WebClient.styles.css?v=1" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
    <script src="_content/MudBlazor/MudBlazor.min.js?v=1"></script>
    <script>
        window.getLocalOffset = function () {
            let d = new Date();
            return d.getTimezoneOffset();
        }

        window.localStorageAccessor = {
            setItem: function (key, value) { localStorage.setItem(key, value); },
            getItem: function (key) { return localStorage.getItem(key); },
            removeItem: function (key) { localStorage.removeItem(key); }
        };

        window.download = function (url) {
            window.open(url, '_blank');
        }
    </script>
</body>

</html>
